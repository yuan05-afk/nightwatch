[project]
name = "nightwatch-ml"
version = "0.1.0"
description = "NIGHTWATCH ML pipeline: imbalance-aware intrusion detection with conformal doubt"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "imbalanced-learn>=0.12",
    "shap>=0.46",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pip-audit>=2.7",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightwatch_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
